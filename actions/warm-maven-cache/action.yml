name: "Warm Maven Cache"
description: >-
  Popula ~/.m2/repository ANTES do Trivy, se o repositório for um projeto
  Maven — mitiga o rate limit (429) do Maven Central ao resolver
  parent/BOM POMs de repositórios Java grandes. Sem efeito nenhum em
  repositórios não-Maven (ver scripts/warm-maven-cache.sh).

runs:
  using: "composite"
  steps:
    - shell: bash
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/warm-maven-cache.sh"
