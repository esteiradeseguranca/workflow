name: "Run EOL Check"
description: >-
  Verifica se linguagens/runtimes/serviços usados no repositório (via
  Dockerfile e manifests comuns) estão fora de suporte (EOL), consultando
  a API pública da endoflife.date.

inputs:
  results-dir:
    description: "Diretório onde salvar o resultado (eol-check.json)"
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/run-eol-check.sh"
