name: "Generate SBOM"
description: "Gera o SBOM (Software Bill of Materials) do repositório em formato CycloneDX"

inputs:
  results-dir:
    description: "Diretório onde salvar o resultado (sbom.json)"
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/run-sbom.sh"
