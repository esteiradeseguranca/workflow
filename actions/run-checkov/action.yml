name: "Run Checkov"
description: "IaC — verifica más configurações em Terraform, CloudFormation, Kubernetes, Dockerfile etc."

inputs:
  results-dir:
    description: "Diretório onde salvar o resultado (checkov.json)"
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job, exportado via $GITHUB_ENV) — não é mais
      # computado aqui (scripts/rules não vivem mais neste repositório
      # público).
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/run-checkov.sh"
