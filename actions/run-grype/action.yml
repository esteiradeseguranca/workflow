name: "Run Grype"
description: >-
  SCA — segunda opinião do Trivy, rodando contra o SBOM que o passo de
  SBOM (Syft) já gerou. PRECISA rodar depois do passo de SBOM no job (ver
  security-scan.yml).

inputs:
  results-dir:
    description: "Diretório com sbom.json e onde salvar o resultado (grype.json)"
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/run-grype.sh"
