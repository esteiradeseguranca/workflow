name: "Run Trivy (filesystem)"
description: "SCA — verifica vulnerabilidades conhecidas nas dependências do projeto"

inputs:
  results-dir:
    description: "Diretório onde salvar o resultado (trivy_fs.json)"
    required: false
    default: "results"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/run-trivy-fs.sh"
