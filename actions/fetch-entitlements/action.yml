name: "Fetch Entitlements"
description: "Consulta o plano do cliente e decide quais ferramentas rodar"

inputs:
  api-url:
    description: "Base da API da Esteira de Segurança"
    required: false
    default: "https://api.esteiradeseguranca.com.br"
  token:
    description: "Token do cliente (secret)"
    required: true

outputs:
  semgrep:
    description: "true/false — rodar Semgrep (SAST)"
    value: ${{ steps.fetch.outputs.semgrep }}
  gitleaks:
    description: "true/false — rodar Gitleaks (segredos)"
    value: ${{ steps.fetch.outputs.gitleaks }}
  trivy_fs:
    description: "true/false — rodar Trivy fs (SCA/dependências)"
    value: ${{ steps.fetch.outputs.trivy_fs }}
  checkov:
    description: "true/false — rodar Checkov (IaC)"
    value: ${{ steps.fetch.outputs.checkov }}
  sbom:
    description: "true/false — gerar SBOM (Syft)"
    value: ${{ steps.fetch.outputs.sbom }}
  grype:
    description: "true/false — rodar Grype (SCA — segunda opinião, lê o SBOM do Syft). Exige sbom também true."
    value: ${{ steps.fetch.outputs.grype }}
  eol_check:
    description: "true/false — checar linguagens/runtimes/serviços fora de suporte (EOL) via endoflife.date"
    value: ${{ steps.fetch.outputs.eol_check }}
  license_compliance:
    description: "true/false — classificar licença de cada componente do SBOM (copyleft forte/fraco/não reconhecida). Exige sbom também true."
    value: ${{ steps.fetch.outputs.license_compliance }}
  raw:
    description: "JSON cru retornado pela API (ou o fallback da camada Básica)"
    value: ${{ steps.fetch.outputs.raw }}

runs:
  using: "composite"
  steps:
    - id: fetch
      shell: bash
      env:
        ESTEIRA_API_URL: ${{ inputs.api-url }}
        ESTEIRA_TOKEN: ${{ inputs.token }}
      # scripts/fetch-entitlements.sh é CI-agnóstico (stdout, não escreve
      # em $GITHUB_OUTPUT direto) — pra dar pra reaproveitar no GitLab CI
      # também (.gitlab/security-scan.yml). Aqui é essa redireção que faz
      # o papel de "output" do GitHub Actions.
      # $ESTEIRA_WORKFLOW_DIR vem da action "Fetch Toolkit" (steps
      # anteriores do job) — scripts/ não vive mais neste repositório
      # público. NOTA: o `>> $GITHUB_OUTPUT` precisa estar DENTRO das
      # aspas (um `run:` só pode ter UM valor string) — a versão anterior
      # desta linha tinha as aspas fechando cedo demais (`"..." >>
      # "..."`), o que não é YAML válido; achado validando com
      # `yaml.safe_load` ao mexer neste arquivo por outro motivo.
      run: "$ESTEIRA_WORKFLOW_DIR/scripts/fetch-entitlements.sh >> $GITHUB_OUTPUT"
