name: Esteira de Segurança — Scan

# Reusable workflow: o cliente referencia este arquivo a partir do
# repositório dele (veja examples/client-workflow.yml). O código-fonte nunca
# sai do runner do cliente — só os resultados do scan são enviados para a
# nossa API.
#
# IMPORTANTE sobre as composite actions usadas abaixo (actions/run-*): elas
# NÃO são referenciadas com caminho local ("./actions/..."). Quando este
# workflow roda como reusable workflow chamado por outro repositório, o
# checkout ativo é o do repositório do CLIENTE — um "uses: ./actions/x"
# resolveria (incorretamente) contra o repo do cliente, não contra o nosso.
# Por isso usamos a forma "owner/repo/path@ref", que sempre aponta para este
# repositório, independente de quem chamou o workflow.
#
# IMPORTANTE #2: os refs abaixo (owner/repo@ref) são LITERAIS, não
# `${{ inputs.x }}` — ACHADO RODANDO DE VERDADE contra o GitHub (não só
# lendo o YAML): `jobs.<job_id>.steps[*].uses` NÃO aceita o contexto
# `inputs` (nem `env`, nem a maioria dos outros) — só um conjunto bem
# restrito de contextos é resolvido nesse campo, e `inputs` não está nele.
# Tentar `uses: ${{ inputs.actions-source }}/...@${{ inputs.actions-ref }}`
# falha na hora de resolver o workflow chamado, ANTES de qualquer job
# começar ("Unrecognized named-value: 'inputs'"), mesmo com o YAML sendo
# perfeitamente válido — só descoberto testando de ponta a ponta contra o
# GitHub de verdade (repositório de teste + cliente piloto), nunca antes.
# Por isso os `uses:` abaixo são hardcoded pra um ref fixo do próprio
# repositório de workflow — ao cortar uma tag nova que quebra
# compatibilidade (ex.: v2), esses valores são atualizados TODOS
# JUNTOS como parte de preparar aquele arquivo `security-scan.yml@v2`,
# é assim que a fixação de versão continua funcionando apesar da
# limitação. `actions-ref` (input abaixo) continua existindo, mas só
# controla a tag do TOOLKIT buscado em GET /v1/toolkit (usado dentro de
# `with:`, que ACEITA o contexto `inputs` normalmente) — não afeta mais
# a resolução das composite actions.
#
# IMPORTANTE #3: este repositório é PÚBLICO (necessário — reusable workflow
# privado só funciona pra chamador dentro da MESMA organização, e clientes
# são empresas externas), mas só contém ORQUESTRAÇÃO (este arquivo +
# actions/ + .gitlab/ + examples/). scripts/ e rules/ — o "molho secreto"
# de verdade do produto — ficam num repositório PRIVADO separado, servidos
# sob demanda pelo passo "Buscar toolkit" abaixo (GET /v1/toolkit,
# autenticado pelo token do cliente). Todas as demais actions esperam
# $ESTEIRA_WORKFLOW_DIR já populado por esse passo — por isso ele roda
# primeiro, logo depois do checkout.
#
# IMPORTANTE #4: o passo "Cache de dependências Maven" (antes do Trivy)
# usa `actions/cache@v4` — official do GitHub, não uma composite action
# nossa, por isso é o único `uses:` deste arquivo (fora `checkout`/
# `upload-artifact`) que NÃO segue o padrão "owner/repo/path@ref" descrito
# no IMPORTANTE #2. Existe pra mitigar um problema real, achado testando
# contra o cliente piloto: escanear um projeto Maven grande (WebGoat) fez
# o Trivy bater no rate limit (429) do Maven Central ao resolver
# parent/BOM POMs ao vivo — `actions/cache` persiste `~/.m2/repository`
# ENTRE execuções (chave por hash de `**/pom.xml`), e
# `warm-maven-cache@v1` roda `mvn dependency:go-offline` ANTES do Trivy
# pra popular esse cache — ver docstring de scripts/warm-maven-cache.sh.
# A partir do segundo scan do mesmo repositório, o Trivy encontra os POMs
# já resolvidos localmente e evita boa parte das chamadas ao Maven
# Central. Não elimina o risco por completo (dependência nova ainda
# precisa ser resolvida ao vivo), mas reduz bastante a superfície.

on:
  workflow_call:
    inputs:
      api-url:
        description: "Base da API da Esteira de Segurança (normalmente não precisa alterar)"
        type: string
        required: false
        default: "https://api.esteiradeseguranca.com.br"
      fail-on-critical:
        description: "Se true, falha o job quando algum achado CRÍTICO for encontrado"
        type: boolean
        required: false
        default: false
      actions-ref:
        description: >-
          [uso interno] tag do bundle buscado em GET /v1/toolkit (scripts/
          regras privadas) — deve acompanhar a tag deste workflow. NÃO
          controla mais a versão das composite actions (essas são
          hardcoded neste arquivo — ver "IMPORTANTE #2" acima); cortar uma
          tag nova exige subir um bundle correspondente pela área
          administrativa (Workflow → nova tag).
        type: string
        required: false
        default: "v1"
    secrets:
      token:
        description: "Token do cliente, gerado na área administrativa da Esteira de Segurança"
        required: true

jobs:
  scan:
    name: Scan de segurança
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # histórico completo — necessário para o Gitleaks varrer commits antigos
          fetch-depth: 0

      - name: Buscar toolkit (scripts/regras privadas)
        uses: esteiradeseguranca/workflow/actions/fetch-toolkit@v1
        with:
          api-url: ${{ inputs.api-url }}
          token: ${{ secrets.token }}
          ref: ${{ inputs.actions-ref }}

      - name: Consultar plano contratado (entitlements)
        id: entitlements
        uses: esteiradeseguranca/workflow/actions/fetch-entitlements@v1
        with:
          api-url: ${{ inputs.api-url }}
          token: ${{ secrets.token }}

      # A PARTIR DAQUI, cada ferramenta roda com `id:` + `continue-on-error:
      # true` — a pedido do usuário: "criar contorno nas execuções das
      # ferramentas de análise para se alguma der problema não impedir a
      # execução das outras." Sem isso, uma ferramenta que quebra (ex.:
      # KICS deu "Permission denied" — achado rodando de verdade contra o
      # cliente piloto WebGoat) marca o JOB como falho e todo passo
      # SEGUINTE cujo `if:` não tenha `always()` é pulado (comportamento
      # padrão do GitHub Actions: um `if:` sem `always()`/`failure()`/
      # `cancelled()` sempre inclui `&& success()` por baixo dos panos) —
      # foi assim que Grype/Compliance de licença/EOL/Scorecard ficaram
      # "skipped" em cadeia depois do KICS falhar, mesmo suas condições
      # não tendo nada a ver com o KICS. `continue-on-error: true` faz a
      # CONCLUSÃO do passo virar "success" mesmo com o script tendo saído
      # com erro (o `outcome` cru continua "failure", é isso que o passo
      # "Coletar erros de execução" abaixo lê) — os passos seguintes
      # continuam vendo `success()` normalmente, sem precisar adicionar
      # `always()` em cada `if:` deles.
      - name: Semgrep (SAST)
        id: semgrep
        if: steps.entitlements.outputs.semgrep == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-semgrep@v1

      - name: Gitleaks (segredos)
        id: gitleaks
        if: steps.entitlements.outputs.gitleaks == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-gitleaks@v1

      - name: Cache de dependências Maven (repositórios Java, antes do Trivy)
        if: steps.entitlements.outputs.trivy_fs == 'true' && hashFiles('**/pom.xml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Aquecer cache Maven (antes do Trivy)
        if: steps.entitlements.outputs.trivy_fs == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/warm-maven-cache@v1

      - name: Trivy (SCA / dependências)
        id: trivy_fs
        if: steps.entitlements.outputs.trivy_fs == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-trivy-fs@v1

      - name: Checkov (IaC)
        id: checkov
        if: steps.entitlements.outputs.checkov == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-checkov@v1

      - name: KICS (IaC — segunda opinião)
        # Escaneia o filesystem direto, sem depender de nenhum outro
        # passo (diferente de Grype/Compliance de licença) — mesma classe
        # de achado do Checkov acima, motor de detecção independente.
        id: kics
        if: steps.entitlements.outputs.kics == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-kics@v1

      - name: SBOM (Syft)
        id: sbom
        if: steps.entitlements.outputs.sbom == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-sbom@v1

      - name: Grype (SCA — segunda opinião)
        # DEPENDE do passo de SBOM acima já ter rodado (lê results/sbom.json
        # gerado por ele) — por isso as duas condições, não só a de grype.
        # Ver scripts/run-grype.sh: sem SBOM presente, o script avisa e sai
        # sem quebrar o scan, mas exigir os dois aqui evita a chamada em vão.
        id: grype
        if: steps.entitlements.outputs.sbom == 'true' && steps.entitlements.outputs.grype == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-grype@v1

      - name: Compliance de licença
        # Mesma dependência dupla do Grype acima, pelo mesmo motivo: lê
        # results/sbom.json em vez de escanear de novo (ver
        # scripts/run-license-compliance.sh).
        id: license_compliance
        if: steps.entitlements.outputs.sbom == 'true' && steps.entitlements.outputs.license_compliance == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-license-compliance@v1

      - name: Verificação de EOL (endoflife.date)
        id: eol_check
        if: steps.entitlements.outputs.eol_check == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-eol-check@v1

      - name: OpenSSF Scorecard (higiene do repositório)
        # SEM condicionamento a sbom (diferente de Grype/Compliance de
        # licença acima) — consulta a API do GitHub direto, não lê
        # nenhum resultado de outro passo (ver scripts/run-scorecard.sh).
        # Só funciona pra repositório hospedado no GitHub — o próprio
        # script detecta isso e sai sem quebrar o scan se não for o caso
        # (ex.: reusable workflow chamado a partir de um mirror não-GitHub).
        id: scorecard
        if: steps.entitlements.outputs.scorecard == 'true'
        continue-on-error: true
        uses: esteiradeseguranca/workflow/actions/run-scorecard@v1

      - name: Coletar erros de execução das ferramentas
        # `if: always()` — precisa rodar mesmo se alguma ferramenta acima
        # falhou (é justamente pra reportar isso). Lê o OUTCOME cru
        # (`steps.<id>.outcome`, NÃO afetado por `continue-on-error` —
        # `conclusion` que seria mascarado) de cada passo com `id:` acima;
        # ausente/"skipped" (ferramenta não habilitada) não conta como
        # erro, só "failure" conta. Guarda em $GITHUB_ENV (ESTEIRA_TOOL_ERRORS,
        # JSON compacto) pro passo "Enviar resultados" logo abaixo incluir
        # no manifest — a pedido do usuário: "informar na área do cliente
        # que e qual execução da ferramenta de scan deu erro." Também
        # imprime `::error::` por ferramenta, pra aparecer destacado nas
        # Annotations do resumo do run — a pedido do usuário: "Mostrar na
        # console da execução que deu erro."
        id: collect-tool-errors
        if: always()
        shell: bash
        env:
          # `toJson(steps)` vai por ENV, não colado direto no `run:` —
          # o JSON tem aspas duplas de sobra, colar direto quebraria o
          # script (a substituição `${{ }}` é textual, ANTES do bash
          # rodar). Via `env:`, o runner passa isso como variável de
          # ambiente de verdade, sem esse risco de quebrar a sintaxe.
          STEPS_JSON: ${{ toJson(steps) }}
        run: |
          FAILED=()
          for tool in semgrep gitleaks trivy_fs checkov kics sbom grype license_compliance eol_check scorecard; do
            value=$(echo "$STEPS_JSON" | jq -r --arg t "$tool" '.[$t].outcome // "not-run"')
            if [[ "$value" == "failure" ]]; then
              FAILED+=("$tool")
              echo "::error::A ferramenta '$tool' falhou ao executar (ver o log do passo acima) — as outras continuaram normalmente."
            fi
          done
          json=$(printf '%s\n' "${FAILED[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "ESTEIRA_TOOL_ERRORS=${json}" >> "$GITHUB_ENV"
          if [[ "$json" != "[]" ]]; then
            echo "Ferramentas com erro de execução: ${json}"
          fi

      - name: Guardar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esteira-seguranca-results
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Enviar resultados para a Esteira de Segurança
        if: always()
        uses: esteiradeseguranca/workflow/actions/submit-results@v1
        with:
          api-url: ${{ inputs.api-url }}
          token: ${{ secrets.token }}

      - name: Verificar achados críticos
        if: inputs.fail-on-critical == true
        uses: esteiradeseguranca/workflow/actions/check-critical@v1
        with:
          api-url: ${{ inputs.api-url }}
          token: ${{ secrets.token }}
